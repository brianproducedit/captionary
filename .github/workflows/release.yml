name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release-apk:
    name: Build & publish release APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_mobile
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Set up Node.js for release metadata
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate tag version
        shell: bash
        run: |
          VERSION="$(sed -n "s/^version:[[:space:]]*//p" pubspec.yaml | tr -d "'\"" | cut -d '+' -f 1)"
          EXPECTED_TAG="v${VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match pubspec version $EXPECTED_TAG"
            exit 1
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Android signing
        shell: bash
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Configuring release keystore from repository secrets..."
            mkdir -p flutter_mobile/android
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > flutter_mobile/android/captionary-release.jks
            cat > flutter_mobile/android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=captionary-release.jks
          EOF
            echo "Keystore setup complete."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not configured in repository secrets."
            echo "Building release APK with debug signing fallback for sideloading."
          fi

      - name: Build universal release APK
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: flutter build apk --release --dart-define=ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}

      - name: Preserve universal APK and build split APKs
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-universal-release.apk 2>/dev/null || true
          flutter build apk --release --split-per-abi --dart-define=ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}
          if [ -f build/app/outputs/flutter-apk/app-universal-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-universal-release.apk build/app/outputs/flutter-apk/app-release.apk
            rm build/app/outputs/flutter-apk/app-universal-release.apk
          fi

      - name: Generate APK checksums and release metadata
        shell: bash
        working-directory: .
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL || 'https://pub-6315c0ddbd0d44b4856162c00e47e86e.r2.dev' }}
        run: |
          cd flutter_mobile/build/app/outputs/flutter-apk
          # Generate SHA256 checksums with relative filenames
          sha256sum *.apk > SHA256SUMS.txt
          echo "Generated SHA256 checksums:"
          cat SHA256SUMS.txt

          # Generate latest-release.json metadata for static and client use
          node -e '
            const fs = require("fs");
            const tag = process.env.RELEASE_TAG;
            const version = tag.replace(/^v/, "");
            const r2Base = process.env.R2_PUBLIC_BASE_URL.replace(/\/+$/, "");
            const files = fs.readdirSync(".").filter(f => f.endsWith(".apk"));
            const assets = files.map(f => {
              const stats = fs.statSync(f);
              let abi = "universal";
              let label = "Universal APK";
              if (f.includes("arm64-v8a")) {
                abi = "arm64-v8a";
                label = "ARM64-v8a (64-bit)";
              } else if (f.includes("armeabi-v7a")) {
                abi = "armeabi-v7a";
                label = "ARMv7a (32-bit)";
              } else if (f.includes("x86_64")) {
                abi = "x86_64";
                label = "x86_64 (Emulators/PC)";
              }
              return {
                name: f,
                downloadUrl: `${r2Base}/apks/${tag}/${f}`,
                size: stats.size,
                abi,
                label
              };
            });
            const meta = {
              version,
              tagName: tag,
              name: `Captionary ${tag}`,
              publishedAt: new Date().toISOString(),
              htmlUrl: `${r2Base}/apks/${tag}`,
              assets
            };
            fs.writeFileSync("latest-release.json", JSON.stringify(meta, null, 2));
            console.log("Generated latest-release.json metadata successfully pointing to R2.");
          '

      - name: Verify APK signatures
        shell: bash
        working-directory: .
        run: |
          for apk in flutter_mobile/build/app/outputs/flutter-apk/*.apk; do
            echo "Verifying $apk..."
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | tail -n 1)/apksigner" verify --verbose "$apk"
          done

      - name: Upload to Cloudflare R2
        shell: bash
        working-directory: flutter_mobile/build/app/outputs/flutter-apk
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'captionary-models' }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::error::R2 secrets (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID) are missing from repository secrets. Add them to repository secrets to enable automated uploads."
            exit 1
          fi

          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "Uploading versioned release $RELEASE_TAG to R2 bucket ${R2_BUCKET}..."
          aws s3 cp . "s3://${R2_BUCKET}/apks/${RELEASE_TAG}/" --recursive --exclude "*" --include "*.apk" --include "SHA256SUMS.txt" --include "latest-release.json" --endpoint-url "$ENDPOINT"

          echo "Updating latest/ pointer in R2..."
          aws s3 cp . "s3://${R2_BUCKET}/apks/latest/" --recursive --exclude "*" --include "*.apk" --include "SHA256SUMS.txt" --endpoint-url "$ENDPOINT"

          echo "Updating root latest-release.json in R2..."
          aws s3 cp latest-release.json "s3://${R2_BUCKET}/apks/latest-release.json" --endpoint-url "$ENDPOINT" --content-type "application/json"

          echo "All release artifacts uploaded to Cloudflare R2 successfully!"

      - name: Publish Private GitHub Release Backup
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            flutter_mobile/build/app/outputs/flutter-apk/*.apk \
            flutter_mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt \
            flutter_mobile/build/app/outputs/flutter-apk/latest-release.json \
            --generate-notes \
            --title "Captionary $RELEASE_TAG" || echo "GitHub release creation skipped or already exists."

      - name: Clean up signing files
        if: always()
        shell: bash
        working-directory: .
        run: rm -f flutter_mobile/android/key.properties flutter_mobile/android/captionary-release.jks

