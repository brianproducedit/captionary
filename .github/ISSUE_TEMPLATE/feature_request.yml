name: Feature request
description: Propose a change to Captionary.
title: "feat: "
labels:
  - feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the local/offline-first implementation and user-visible result.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: Does not require a hosted backend.
        - label: Preserves offline operation.
        - label: Keeps secrets out of the app bundle.
