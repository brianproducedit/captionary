name: Bug report
description: Report a reproducible problem in Captionary.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest reliable reproduction.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or emulator
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Remove credentials and personal data before posting.
